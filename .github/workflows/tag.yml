# Tags a release: once a release PR is merged and `ci` and `mac` are both green on that commit of
# `main`, creates the tag v<version> and the GitHub release (notes from docs/releases/<version>.md)
# with the release GitHub App's token, so that release.yml starts (a tag pushed with GITHUB_TOKEN
# would not start it). Spec: docs/releases/automation.md. Nobody tags by hand (AGENTS.md,
# "Releases"). Every action is pinned to a full commit SHA (the tag is in the comment).
#
# Quiet stops (exit 0, with a notice): not a release commit, no notes file, the tag exists, the
# other of the two workflows is not green yet (it comes back here when it finishes).
name: tag

on:
  workflow_run:
    workflows: [ci, mac]
    types: [completed]
    branches: [main]

permissions:
  contents: read

# Whichever of `ci` and `mac` finishes second does the work; two runs at once would race on the
# tag, so they take turns and the second finds the tag made. One group per commit: a run for
# a later commit must never replace a waiting run for the release commit.
concurrency:
  group: tag-${{ github.event.workflow_run.head_sha }}
  cancel-in-progress: false

jobs:
  tag:
    name: tag a merged release
    # Only a push to main of this repository: a pull request from a fork whose branch is named
    # `main` also reports head_branch `main`, and its commit must never be tagged.
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
      && github.event.workflow_run.event == 'push'
      && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    # The App's key is a secret of this environment, deployable from `main` only (no reviewers).
    environment: release-tag
    permissions:
      contents: read
      actions: read
    env:
      HEAD_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 2
          persist-credentials: false
      - name: Is this a release commit that is not yet tagged
        id: version
        run: |
          set -euo pipefail
          version=$(sed -n 's/^ *\.version = "\([^"]*\)",.*/\1/p' build.zig.zon | head -n 1)
          if ! [[ "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "::error::tag: build.zig.zon has no version such as 0.5.1 (read '$version')"
            exit 1
          fi
          if ! [ -f "docs/releases/$version.md" ]; then
            echo "::notice::tag: no docs/releases/$version.md at $HEAD_SHA, so $version is not a release"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          # The release commit is the one that ADDED the notes (--diff-filter=A: an edit of the notes
          # does not count): a later commit of main that finds
          # the same state (the release's own run failed) must not be tagged as the release.
          if ! git diff --name-only --diff-filter=A HEAD^ HEAD | grep -qxF "docs/releases/$version.md"; then
            echo "::notice::tag: $HEAD_SHA did not add docs/releases/$version.md, so it is not the release commit of $version; re-run the failed ci or mac on the release commit itself"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          status=0
          gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/v$version" > /dev/null 2> "$RUNNER_TEMP/tagcheck" || status=$?
          if [ "$status" = 0 ]; then
            echo "::notice::tag: v$version exists already"
            echo "go=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if ! grep -q 'HTTP 404' "$RUNNER_TEMP/tagcheck"; then
            echo "::error::tag: could not look up v$version: $(head -c 200 "$RUNNER_TEMP/tagcheck")"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "go=true" >> "$GITHUB_OUTPUT"
      # The latest run of each workflow for this commit, from the API, not from the event: the
      # event is only the one that finished first or second.
      - name: ci and mac are both green on this commit
        id: green
        if: ${{ steps.version.outputs.go == 'true' }}
        run: |
          set -euo pipefail
          go=true
          for workflow in ci.yml mac.yml; do
            conclusion=$(gh api -X GET "repos/$GITHUB_REPOSITORY/actions/workflows/$workflow/runs" \
              -f head_sha="$HEAD_SHA" -f event=push --jq \
              '.workflow_runs | sort_by(.created_at) | last | .conclusion // "none"')
            echo "tag: $workflow at $HEAD_SHA: $conclusion"
            if [ "$conclusion" != "success" ]; then go=false; fi
          done
          if [ "$go" != "true" ]; then
            echo "::notice::tag: waiting for ci and mac to both succeed on $HEAD_SHA; the one that finishes last comes back here"
          fi
          echo "go=$go" >> "$GITHUB_OUTPUT"
      # Contents write on this repository alone, and nothing else the App can do.
      - name: Mint the App token
        id: app
        if: ${{ steps.green.outputs.go == 'true' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          repositories: zigbox
          permission-contents: write
      - name: Create the tag and the release
        if: ${{ steps.green.outputs.go == 'true' }}
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          flags=()
          if [[ "$VERSION" == *-* ]]; then flags+=(--prerelease); fi
          gh release create "v$VERSION" --repo "$GITHUB_REPOSITORY" --target "$HEAD_SHA" \
            --title "zigbox $VERSION" --notes-file "docs/releases/$VERSION.md" "${flags[@]}"
          echo "tag: created v$VERSION at $HEAD_SHA"
