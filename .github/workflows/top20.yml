# The top-20 check (docs/demos/m4.md): pull and run the twenty most-pulled official Docker Hub
# images (src/testing/vm/top20.zon) in the test VM. Weekly and on demand, never on a pull
# request. It uses the real Docker Hub, not the mirror the PR demos use, so it can meet the
# anonymous pull limit; a 429 shows as that image's reason. Each image runs twice in the same VM,
# by its floating tag and by its pinned digest; one line per run, and one line comparing the two
# (upstream image moved, or runtime regression: docs/demos/m4.md, "Floating and pinned"), go to
# the job summary. The job fails if a run of either list fails without a documented reason.
# Weekly and on demand (and on vm/top20-* scratch branches), never on a pull request.
name: top20

on:
  schedule:
    - cron: "17 4 * * 1"
  workflow_dispatch:
  # Dispatch needs the workflow on main; until it is, a push to vm/top20-<anything> runs it
  # (vm.yml ignores those branches), and the run deletes its scratch branch when it ends, as
  # vm.yml does (AGENTS.md, "Git").
  push:
    branches: ['vm/top20-**']

permissions:
  contents: write # only to delete a vm/top20-* scratch branch at the end

jobs:
  top20:
    name: top20 (Ubuntu 24.04 VM, KVM, real Docker Hub)
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Pull and run the twenty images, by tag and by pinned digest
        run: zig build top20 -Daccel=kvm 2>&1 | tee top20.log
        shell: bash
      - name: Results
        if: always()
        run: |
          {
            echo '### Top 20 official images: floating tag against pinned digest'
            echo
            echo '```'
            grep '^top20-compare: ' top20.log | sort -u | sed 's/^top20-compare: //'
            echo '```'
            echo
            echo '### Every run'
            echo
            echo '```'
            grep '^top20-result: ' top20.log | sort -u | sed 's/^top20-result: //'
            grep -E '^top20: (pinned: )?[0-9]+ passed' top20.log | sort -u
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      # Not on cancel, and never on main (schedule and dispatch run there).
      - name: Delete the scratch branch
        if: (success() || failure()) && github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
