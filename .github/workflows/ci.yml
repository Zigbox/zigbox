# Zigbox CI. Every action is pinned to a full commit SHA (the tag is in the comment); Zig is
# installed from a verified tarball (.github/actions/setup-zig); QEMU from apt. No other shell
# but .github/ci-changes.sh, which the `changes` job runs to decide what the rest does.
#
# What runs (docs/decisions/2026-11-04-ci-affected-demos.md):
#   - A pull request that changes only docs (a .md outside src/, anything under site/ outside
#     site/errors/) runs nothing but `changes`.
#   - A pull request runs the VM demos its changed paths can affect, chosen by ci-changes.sh.
#   - A push to main, a pull request from a claude/release-* branch and a pull request labelled
#     full-ci run everything.
#   - Every Zig job restores the build cache (.github/actions/zig-cache).
name: ci

# CI runs on pull requests and on main only: a pushed branch without a PR runs nothing, so
# Actions time is spent once per change. Open a PR when a change needs CI. A newer push to the
# same PR cancels the run it supersedes; runs on main are never cancelled.
on:
  push:
    branches: [main]
  # `labeled` so that adding full-ci to a pull request starts the full run.
  pull_request:
    types: [opened, synchronize, reopened, labeled]

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # Which of the jobs below run. Fast (seconds); every other job needs it.
  changes:
    name: what changed
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    outputs:
      code: ${{ steps.pick.outputs.code }}
      demo_m0: ${{ steps.pick.outputs.demo_m0 }}
      demo_m1: ${{ steps.pick.outputs.demo_m1 }}
      demo_m2: ${{ steps.pick.outputs.demo_m2 }}
      demo_m3: ${{ steps.pick.outputs.demo_m3 }}
      demo_m4: ${{ steps.pick.outputs.demo_m4 }}
      demo_m5: ${{ steps.pick.outputs.demo_m5 }}
      demo_m6: ${{ steps.pick.outputs.demo_m6 }}
      demo_m6b: ${{ steps.pick.outputs.demo_m6b }}
      demo_m7: ${{ steps.pick.outputs.demo_m7 }}
      demo_m8: ${{ steps.pick.outputs.demo_m8 }}
      demo_m8_packages: ${{ steps.pick.outputs.demo_m8_packages }}
      demo_m8b: ${{ steps.pick.outputs.demo_m8b }}
      demo_m10: ${{ steps.pick.outputs.demo_m10 }}
    steps:
      # Two commits: on a pull request the checkout is the merge commit, whose first parent is the
      # base, so HEAD^1..HEAD is exactly what the pull request changes.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 2
      - name: Pick the jobs
        id: pick
        env:
          EVENT: ${{ github.event_name }}
          HEAD_REF: ${{ github.head_ref }}
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ' ') }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            git diff --name-only HEAD^1 HEAD | tee /dev/stderr | .github/ci-changes.sh
          else
            .github/ci-changes.sh < /dev/null
          fi
          cat "$GITHUB_OUTPUT"

  build:
    name: build (both targets, size gate)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: build
      - name: Build
        run: zig build
      # Cross-compiles x86_64 and aarch64 in ReleaseSafe, stripped, and fails if either binary
      # is 2 MiB or larger.
      - name: Release builds and size check
        run: zig build release
      # The pure trust surface Zigcube links must compile for wasm32-freestanding.
      - name: Trust surface for wasm32-freestanding
        run: zig build trust-wasm

  tidy:
    name: tidy
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: tidy
      - name: Formatting, line and function length, banned patterns, assertion density
        run: zig build tidy

  test:
    name: test
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: test
      - name: Unit, snapshot and simulation tests
        run: zig build test --summary all

  errors-site:
    name: errors site is up to date
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: errors-site
      # site/errors/<code>.html is generated from the diagnostic registry. Fails, naming the
      # first page, if a checked-in page is missing or differs: run `zig build errors-site`.
      - name: Generated pages match the registry
        run: zig build errors-site-check

  fuzz:
    name: fuzz (every fuzzer, fresh seeds)
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: fuzz
      # One job runs every fuzzer in turn (`all`), 10,000 iterations each, as the per-fuzzer jobs
      # did. Each fuzzer draws a fresh random seed and prints `fuzz: <name> seed=<n> ...` before it
      # starts, flushed, so the last `fuzz:` line before a failure names the fuzzer and its seed;
      # replay it with `zig build fuzz -- <name> <seed> 10000`.
      - name: Fuzz every fuzzer
        run: zig build fuzz -- all 10000

  # The D-Bus client against a real dbus-daemon (a private session bus), which is what shows that
  # the simulator's bus and the real one agree: Hello, calls, AddMatch, signals, and bytes the
  # bus accepts or refuses. See src/dbus_live.zig.
  dbus-live:
    name: D-Bus client against a real dbus-daemon
    needs: changes
    if: ${{ needs.changes.outputs.code == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: dbus-live
      - name: Install dbus-daemon
        uses: ./.github/actions/install-apt
        with:
          packages: dbus
      - name: Run the client against a private session bus
        run: dbus-run-session -- zig build dbus-live

  demo-m0:
    name: demo-m0 (Ubuntu 24.04 VM, KVM)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m0 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      # GitHub's documented way to let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The cache key is derived from src/testing/vm/lib/image.zon, which holds the image's
      # SHA-256: a new pin is a new key. The harness re-verifies the hash on every run.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      # Boots the pinned Ubuntu image, runs the three demo steps, prints the guest console.
      # On failure the log above names the step, the expectation and the guest output.
      - name: Run the M0 demo
        run: zig build demo-m0 -Daccel=kvm

  # Sibling of demo-m0: the same VM image and provisioning, then `zbx run` in the pinned Alpine
  # minirootfs: the shell on stdin, a host-visible process, a write into the rootfs, exit 42, a
  # real Ctrl-C (exit 130 within 2 s), the full id map, an invisible host, E0201, and a bundle
  # with no secret in it. See docs/demos/m1.md.
  demo-m1:
    name: demo-m1 (Ubuntu 24.04 VM, KVM, Alpine rootfs)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m1 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entry as demo-m0 (same path, same key), so the base image is downloaded
      # once for both jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      # The Alpine minirootfs (3.5 MB), keyed by src/testing/vm/alpine.zon, which holds its
      # SHA-256. The harness re-verifies the hash on every run, cached or downloaded.
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M1 demo
        run: zig build demo-m1 -Daccel=kvm

  # Sibling of demo-m1: the same VM and rootfs, then the four steps of the M2 spec (a fork bomb
  # under --pids 64, stress-ng under --memory 128m, a refused mount, a read-only root), the
  # acceptance criteria (limits visible under the user's slice and gone after; oom, process
  # limit, signal and exit told apart) and the lifecycle (run -d, ps, stop, --timeout). stress-ng
  # is installed with apk inside a zbx run, over the VM's network. See docs/demos/m2.md.
  demo-m2:
    name: demo-m2 (Ubuntu 24.04 VM, KVM, Alpine rootfs, limits)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m2 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entry as demo-m0 (same path, same key), so the base image is downloaded
      # once for both jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      # The Alpine minirootfs (3.5 MB), keyed by src/testing/vm/alpine.zon, which holds its
      # SHA-256. The harness re-verifies the hash on every run, cached or downloaded.
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M2 demo
        run: zig build demo-m2 -Daccel=kvm

  # Sibling of demo-m2: the same VM and rootfs. First the upgrade test (the M2 binary, built from a
  # worktree of the pinned commit, leaves version 3 run records that this build reads), then the
  # five steps of the M3 spec (import and du, a 10 MB copy, apk add and commit and diff, a damaged
  # object found by verify, a deleted file that shrinks the stored size), the acceptance criteria
  # (the same digest, modes, owners, xattrs and links round-trip, a running container never
  # writes the store) and gc's plan, confirm, lock, trash and restore. apk runs inside a zbx run,
  # over the VM's network. See docs/demos/m3.md.
  demo-m3:
    name: demo-m3 (Ubuntu 24.04 VM, KVM, Alpine rootfs, store)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m3 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      # The whole history: the upgrade test builds the M2 commit (src/testing/vm/old_release.zon)
      # in a git worktree, and a shallow clone does not have it.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entry as demo-m0 (same path, same key), so the base image is downloaded
      # once for both jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      # The Alpine minirootfs (3.5 MB), keyed by src/testing/vm/alpine.zon, which holds its
      # SHA-256. The harness re-verifies the hash on every run, cached or downloaded.
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M3 demo
        run: zig build demo-m3 -Daccel=kvm

  # Sibling of demo-m3: the same VM. First the upgrade test (the merged M3 zbx, built from a
  # worktree of the commit in old_release.zon, leaves a store this build reads), then the five
  # steps of the M4 spec (pull alpine, run it, pull the two pythons and compare their cost in
  # `store du --by-image`, run python, a wrong digest in zbx.lock), the acceptance criteria (a
  # pull killed halfway resumes; an image is its tree digest) and the scripted agent, which does
  # the demo again through --output json, `zbx schema` and `zbx explain` only. docker.io is
  # reached through mirror.gcr.io, as docs/DECISIONS.md decided: Docker Hub's anonymous limit is
  # shared by every runner address. The pulled blobs stay on a second disk that is cached between
  # runs, keyed by src/testing/vm/zbx.lock (the images the demo pulls). See docs/demos/m4.md.
  demo-m4:
    name: demo-m4 (Ubuntu 24.04 VM, KVM, pull, upgrade, agent test)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m4 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      # The whole history: the upgrade test builds the M3 commit in a git worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      # The blobs the demo pulled last time, as a raw disk image the guest formats and mounts
      # (src/testing/vm/accept_m4.zig). The demo mirrors the store's blobs onto it at the end, so
      # it holds what the lock names and nothing older. A hit saves the downloads; a miss only
      # costs them.
      - name: Cache the pulled blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/m4-blobs.img
          key: vm-m4-blobs-${{ hashFiles('src/testing/vm/zbx.lock') }}
      - name: Run the M4 demo
        run: zig build demo-m4 -Daccel=kvm

  # Sibling of demo-m4: the same VM. For now the upgrade test only: the merged M4 zbx (built from
  # a worktree of the commit in old_release.zon) pulls alpine:3.20, runs it and commits, and this
  # build reads its store, image record, run record and zbx.lock and runs the image with the
  # default --net none. docker.io is reached through mirror.gcr.io, as for demo-m4. The image
  # is small, so no blob cache disk.
  demo-m5:
    name: demo-m5 (Ubuntu 24.04 VM, KVM, upgrade from M4)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m5 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      # The whole history: the upgrade test builds the M4 commit in a git worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Run the M5 demo
        run: zig build demo-m5 -Daccel=kvm

  # Sibling of demo-m5: the same VM. The upgrade test (the merged M5 zbx, built from a worktree of
  # the commit in old_release.zon, pulls alpine:3.20 and postgres:16, runs with --net user and
  # commits; this build reads its store, records and lock, and runs postgres with a new --state
  # volume on it), the spec's five steps with postgres, and the acceptance checks of state
  # volumes. docker.io is reached through mirror.gcr.io, as for demo-m5. postgres is the one
  # large image, so no blob cache disk.
  demo-m6:
    name: demo-m6 (Ubuntu 24.04 VM, KVM, upgrade from M5)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m6 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      # The whole history: the upgrade test builds the M5 commit in a git worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Run the M6 demo
        run: zig build demo-m6 -Daccel=kvm

  # Sibling of demo-m6: the same VM. The upgrade test (the merged M6 zbx, built from a worktree of
  # the commit in old_release.zon, starts a detached container with a --state volume; this build
  # reads its store and record, execs into it and stops it), the spec's five steps of the dev loop
  # (a mounted directory served by python, exec, logs, a refused mount), the acceptance checks of
  # writable mounts, logs and exec, and the agent test. docker.io is reached through
  # mirror.gcr.io, as for demo-m6.
  demo-m6b:
    name: demo-m6b (Ubuntu 24.04 VM, KVM, upgrade from M6)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m6b == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      # The whole history: the upgrade test builds the M6 commit in a git worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Run the M6b demo
        run: zig build demo-m6b -Daccel=kvm

  # The M7 demo (docs/demos/m7.md): the 0.2.0 binary seeds a store (the upgrade test), then the
  # brief's six steps of `zbx build` on a Go hello-world, the acceptance checks and the agent test
  # in one VM, and the golden digest in a second, clean one. docker.io is reached through
  # mirror.gcr.io, as for demo-m6.
  demo-m7:
    name: demo-m7 (Ubuntu 24.04 VM, KVM, upgrade from 0.2.0)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m7 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      # The whole history: the upgrade test builds the 0.2.0 commit in a git worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Run the M7 demo
        run: zig build demo-m7 -Daccel=kvm

  # The M8 demo: the upgrade test (upgrade_m8.zig) reads what the v0.3.1 binary leaves, then the
  # demo's own steps run. docker.io is reached through mirror.gcr.io, as for demo-m7.
  demo-m8:
    name: demo-m8 (Ubuntu 24.04 VM, KVM, upgrade from v0.3.1)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m8 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      # The whole history: the upgrade test builds the v0.3.1 tag in a git worktree.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Run the M8 demo
        run: zig build demo-m8 -Daccel=kvm

  # The M8 packages demo (main_m8_packages.zig): the packages `zig build packages` writes, installed
  # in four guests (Ubuntu 24.04 and Debian 12 with apt, Fedora and Rocky 9 with dnf). The other
  # guest images are cached as vm.yml caches them.
  demo-m8-packages:
    name: demo-m8-packages (four guests, KVM)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m8_packages == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      ZBX_REGISTRY_MIRRORS: mirror.gcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Cache the other guest images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache/zbx-vm-guests/debian-*.qcow2
            .zig-cache/zbx-vm-guests/Fedora-*.qcow2
            .zig-cache/zbx-vm-guests/Rocky-*.qcow2
          key: vm-guests-${{ hashFiles('src/testing/vm/lib/guests.zon') }}
      - name: Run the M8 packages demo
        run: zig build demo-m8-packages -Daccel=kvm

  # The M8b demo (docs/demos/m8b.md): `--listen` hands a listener made inside the container's
  # network namespace to the harness over a Unix socket (hello, hostile, refusals, closed). The
  # container runs from the pinned Alpine minirootfs, so nothing is pulled from a registry.
  demo-m8b:
    name: demo-m8b (Ubuntu 24.04 VM, KVM, listener handoff)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m8b == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
