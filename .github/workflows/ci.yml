# Zigbox CI. Every action is pinned to a full commit SHA (the tag is in the comment); Zig is
# installed from a verified tarball (.github/actions/setup-zig); QEMU from apt. No other shell.
name: ci

# CI runs on pull requests and on main only: a pushed branch without a PR runs nothing, so
# Actions time is spent once per change. Open a PR when a change needs CI. A newer push to the
# same PR cancels the run it supersedes; runs on main are never cancelled.
on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  build:
    name: build (both targets, size gate)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Build
        run: zig build
      # Cross-compiles x86_64 and aarch64 in ReleaseSafe, stripped, and fails if either binary
      # is 2 MiB or larger.
      - name: Release builds and size check
        run: zig build release

  tidy:
    name: tidy
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Formatting, line and function length, banned patterns, assertion density
        run: zig build tidy

  test:
    name: test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Unit, snapshot and simulation tests
        run: zig build test --summary all

  errors-site:
    name: errors site is up to date
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      # site/errors/<code>.html is generated from the diagnostic registry. Fails, naming the
      # first page, if a checked-in page is missing or differs: run `zig build errors-site`.
      - name: Generated pages match the registry
        run: zig build errors-site-check

  fuzz:
    name: fuzz (${{ matrix.fuzzer }})
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        fuzzer:
          - host_read
          - host_write
          - cli
          - text
          - doctor
          - diag
          - diagnostic
          - run
          - record
          - redact
          - dbus
          - seccomp
          - tree
          - store
          - parse_sysctl
          - parse_kernel
          - parse_controllers
          - parse_subid
          - parse_passwd
          - parse_seccomp
          - parse_capability
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      # A random seed, printed first by the runner; a failure replays with
      # `zig build fuzz -- <fuzzer> <seed>`. 10,000 iterations is the default.
      - name: Fuzz ${{ matrix.fuzzer }}
        run: zig build fuzz -- ${{ matrix.fuzzer }}

  # The D-Bus client against a real dbus-daemon (a private session bus), which is what shows that
  # the simulator's bus and the real one agree: Hello, calls, AddMatch, signals, and bytes the
  # bus accepts or refuses. See src/dbus_live.zig.
  dbus-live:
    name: D-Bus client against a real dbus-daemon
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install dbus-daemon
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends dbus
      - name: Run the client against a private session bus
        run: dbus-run-session -- zig build dbus-live

  demo-m0:
    name: demo-m0 (Ubuntu 24.04 VM, KVM)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      # GitHub's documented way to let the runner user open /dev/kvm.
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The cache key is derived from src/testing/vm/image.zon, which holds the image's
      # SHA-256: a new pin is a new key. The harness re-verifies the hash on every run.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/image.zon') }}
      # Boots the pinned Ubuntu image, runs the three demo steps, prints the guest console.
      # On failure the log above names the step, the expectation and the guest output.
      - name: Run the M0 demo
        run: zig build demo-m0 -Daccel=kvm

  # Sibling of demo-m0: the same VM image and provisioning, then `zbx run` in the pinned Alpine
  # minirootfs: the shell on stdin, a host-visible process, a write into the rootfs, exit 42, a
  # real Ctrl-C (exit 130 within 2 s), the full id map, an invisible host, E0201, and a bundle
  # with no secret in it. See docs/demos/m1.md.
  demo-m1:
    name: demo-m1 (Ubuntu 24.04 VM, KVM, Alpine rootfs)
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entry as demo-m0 (same path, same key), so the base image is downloaded
      # once for both jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/image.zon') }}
      # The Alpine minirootfs (3.5 MB), keyed by src/testing/vm/alpine.zon, which holds its
      # SHA-256. The harness re-verifies the hash on every run, cached or downloaded.
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M1 demo
        run: zig build demo-m1 -Daccel=kvm

  # Sibling of demo-m1: the same VM and rootfs, then the four steps of the M2 spec (a fork bomb
  # under --pids 64, stress-ng under --memory 128m, a refused mount, a read-only root), the
  # acceptance criteria (limits visible under the user's slice and gone after; oom, process
  # limit, signal and exit told apart) and the lifecycle (run -d, ps, stop, --timeout). stress-ng
  # is installed with apk inside a zbx run, over the VM's network. See docs/demos/m2.md.
  demo-m2:
    name: demo-m2 (Ubuntu 24.04 VM, KVM, Alpine rootfs, limits)
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entry as demo-m0 (same path, same key), so the base image is downloaded
      # once for both jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/image.zon') }}
      # The Alpine minirootfs (3.5 MB), keyed by src/testing/vm/alpine.zon, which holds its
      # SHA-256. The harness re-verifies the hash on every run, cached or downloaded.
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M2 demo
        run: zig build demo-m2 -Daccel=kvm
