        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M8b demo
        run: zig build demo-m8b -Daccel=kvm

  # The M10 demo (docs/demos/m10.md): `--device` and `--gpu` with a fake vendor spec, doctor's GPU
  # section and the refusals. The container runs from the pinned Alpine minirootfs, so nothing is
  # pulled from a registry. The guest has no render node: `--gpu dri` is recorded as not run.
  demo-m10:
    name: demo-m10 (Ubuntu 24.04 VM, KVM, --device and --gpu)
    needs: changes
    if: ${{ needs.changes.outputs.demo_m10 == 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/ubuntu-24.04-server-cloudimg-amd64.img
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      - name: Run the M10 demo
        run: zig build demo-m10 -Daccel=kvm
