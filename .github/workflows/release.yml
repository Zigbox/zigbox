# Zigbox release: signs the apt and dnf repositories with the release signing subkey and attaches
# zigbox-repos.tar.gz to the tag's GitHub release (docs/decisions/2026-11-11-ci-signs-packages-
# with-a-subkey.md; runbook docs/releases/packaging.md). Every action is pinned to a full commit
# SHA (the tag is in the comment), as in ci.yml. The signing logic is .github/release-sign.sh;
# the `test` job runs the same file with a throwaway key, never in the `release` environment.
name: release

on:
  # A release tag: the `release` environment (owner approval, tag-only deployments) gates the job.
  push:
    tags: ['v*']
    # A scratch branch runs the `test` job alone, to try this workflow before a pull request.
    branches: ['release-test/**']
  # Sign an existing release again. `tag` is a tag, and the run must be started from that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to sign, such as v0.5.0 (a tag only)'
        required: true
        type: string
  # The `test` job on a change to anything the release reads. No secret is available here.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-sign.sh'
      - '.github/release-sign-test.sh'
      - '.github/package-refresh.sh'
      - '.github/package-refresh-test.sh'
      - 'src/package.zig'
      - 'src/package_*.zig'
      - 'src/package/**'
      - 'packaging/**'
      - 'build.zig'
      - 'build.zig.zon'

permissions:
  contents: read

jobs:
  # The whole signing script with a throwaway key: import from stdin, round 1 and 2, the check,
  # every gpg --verify and rpm -Kv, the archive. It attaches nothing and dispatches nothing.
  test:
    name: test the signing script (throwaway key)
    if: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: release-test
      - name: Install rpm and ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm shellcheck
      - name: ShellCheck
        run: shellcheck .github/release-sign.sh .github/release-sign-test.sh .github/package-refresh.sh .github/package-refresh-test.sh
      - name: Sign with a throwaway key
        run: .github/release-sign-test.sh "$RUNNER_TEMP/out"
      - name: Refresh and refuse with a throwaway key
        run: .github/package-refresh-test.sh "$RUNNER_TEMP/refresh"
      - name: The archive holds what packaging.md says and nothing secret
        run: |
          tar -tzf "$RUNNER_TEMP/out/zigbox-repos.tar.gz" | tee /dev/stderr > "$RUNNER_TEMP/list"
          grep -q '^apt/dists/stable/InRelease$' "$RUNNER_TEMP/list"
          grep -q '^zigbox-archive-keyring.gpg$' "$RUNNER_TEMP/list"
          # Only apt/, rpm/ and the two keyring files (packaging.md, step 7), no dot files.
          ! grep -Evq '^(apt/|rpm/|zigbox-archive-keyring\.(asc|gpg)$)' "$RUNNER_TEMP/list"
          ! grep -Eq '(^|/)\.' "$RUNNER_TEMP/list"
          ! grep -Eq 'to-sign|test-key|passphrase|secret' "$RUNNER_TEMP/list"

  sign:
    name: sign and attach
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The signing key is a secret of this environment: the owner approves each run, and only
    # tags may deploy to it. Nothing else in this file can read it.
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # Before the checkout and before anything reads a secret. The tag comes in through the
      # environment, never spliced into the script.
      - name: Refuse anything but a release tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "release: '$TAG' is not a release tag such as v0.5.0" >&2
            exit 1
          fi
          if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "release: start the run from the tag $TAG (Use workflow from: the tag), not from $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # Nothing here pushes; the token must not sit in .git/config for the build to read.
          persist-credentials: false
      # No toolchain cache here: the toolchain runs while the subkey is unlocked, so it is
      # downloaded and checked against its SHA-256 on every run.
      - uses: ./.github/actions/setup-zig
        with:
          cache: 'false'
      - name: Install rpm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm
      - name: The release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || {
            echo "release: no GitHub release for $TAG; create it, then re-run from the tag" >&2
            exit 1
          }
      # The key and passphrase reach this one step through the environment and the script
      # reads them from there; nothing here prints them or takes them as an argument.
      - name: Sign
        env:
          ZIGBOX_SIGNING_KEY: ${{ secrets.ZIGBOX_SIGNING_KEY }}
          ZIGBOX_SIGNING_PASSPHRASE: ${{ secrets.ZIGBOX_SIGNING_PASSPHRASE }}
          # Pinned here, in reviewed code, not read from the environment: users trust this
          # fingerprint (docs/releases/packaging.md, "The release key").
          ZIGBOX_SIGNING_FPR: 09991DC39816D3C914E2A22C5AB00BC328B7DBB7
        run: .github/release-sign.sh "$RUNNER_TEMP/out"
      - name: The archive holds what packaging.md says and nothing secret
        run: |
          tar -tzf "$RUNNER_TEMP/out/zigbox-repos.tar.gz" > "$RUNNER_TEMP/list"
          grep -q '^apt/dists/stable/InRelease$' "$RUNNER_TEMP/list"
          grep -q '^zigbox-archive-keyring.gpg$' "$RUNNER_TEMP/list"
          ! grep -Evq '^(apt/|rpm/|zigbox-archive-keyring\.(asc|gpg)$)' "$RUNNER_TEMP/list"
          ! grep -Eq '(^|/)\.' "$RUNNER_TEMP/list"
          ! grep -Eq 'to-sign|test-key|passphrase|secret' "$RUNNER_TEMP/list"
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/out/zigbox-repos.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
      # The deploy of zigbox.org (Zigbox/zigbox.github.io) picks the asset up on its own
      # schedule, every six hours. A `repository_dispatch` of type `site` would need a token
      # that can write to that repository, and this repository has none: see
      # docs/releases/packaging.md, "Dispatching the site deploy".
