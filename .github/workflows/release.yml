# Zigbox release: signs the apt and dnf repositories with the release signing subkey and attaches
# zigbox-repos.tar.gz to the tag's GitHub release (docs/decisions/2026-11-11-ci-signs-packages-
# with-a-subkey.md; runbook docs/releases/packaging.md). Every action is pinned to a full commit
# SHA (the tag is in the comment), as in ci.yml. The signing logic is .github/release-sign.sh;
# the `test` job runs the same file with a throwaway key, never in the `release` environment.
#
# A release is automated (docs/releases/automation.md): tag.yml makes the tag and the GitHub
# release; on that tag `linux` (apt and rpm archive) and `mac` (Developer ID, notarization) wait
# for the owner's one approval of `release`; `publish` then commits the Homebrew formula and runs
# the zigbox.org deploy, and `verify` installs from the tap. `test` and `mac-test` try the same
# steps with throwaway keys and no secret.
name: release

on:
  # A release tag: the `release` environment (owner approval, tag-only deployments) gates the job.
  push:
    tags: ['v*']
    # A scratch branch runs the `test` job alone, to try this workflow before a pull request.
    branches: ['release-test/**']
  # Sign an existing release again. `tag` is a tag, and the run must be started from that tag.
  workflow_dispatch:
    inputs:
      tag:
        description: 'The release tag to sign, such as v0.5.0 (a tag only)'
        required: true
        type: string
  # The `test` job on a change to anything the release reads. No secret is available here.
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - '.github/release-sign.sh'
      - '.github/release-sign-test.sh'
      - 'src/mac_release.zig'
      - 'packaging/homebrew/**'
      - 'src/package.zig'
      - 'src/package_*.zig'
      - 'src/package/**'
      - 'packaging/**'
      - 'build.zig'
      - 'build.zig.zon'

permissions:
  contents: read

jobs:
  # The whole signing script with a throwaway key: import from stdin, round 1 and 2, the check,
  # every gpg --verify and rpm -Kv, the archive. It attaches nothing and dispatches nothing.
  test:
    name: test the signing script (throwaway key)
    if: ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-zig
      - uses: ./.github/actions/zig-cache
        with:
          name: release-test
      - name: Install rpm and ShellCheck
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm shellcheck
      - name: ShellCheck
        run: shellcheck .github/release-sign.sh .github/release-sign-test.sh
      - name: Sign with a throwaway key
        run: .github/release-sign-test.sh "$RUNNER_TEMP/out"
      - name: The archive holds what packaging.md says and nothing secret
        run: |
          tar -tzf "$RUNNER_TEMP/out/zigbox-repos.tar.gz" | tee /dev/stderr > "$RUNNER_TEMP/list"
          grep -q '^apt/dists/stable/InRelease$' "$RUNNER_TEMP/list"
          grep -q '^zigbox-archive-keyring.gpg$' "$RUNNER_TEMP/list"
          # Only apt/, rpm/ and the two keyring files (packaging.md, step 7), no dot files.
          ! grep -Evq '^(apt/|rpm/|zigbox-archive-keyring\.(asc|gpg)$)' "$RUNNER_TEMP/list"
          ! grep -Eq '(^|/)\.' "$RUNNER_TEMP/list"
          ! grep -Eq 'to-sign|test-key|passphrase|secret' "$RUNNER_TEMP/list"

  linux:
    name: sign and attach (apt and rpm)
    if: ${{ github.ref_type == 'tag' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    # The signing key is a secret of this environment: the owner approves each run, and only
    # tags may deploy to it. Nothing else in this file can read it.
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # Before the checkout and before anything reads a secret. The tag comes in through the
      # environment, never spliced into the script.
      - name: Refuse anything but a release tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "release: '$TAG' is not a release tag such as v0.5.0" >&2
            exit 1
          fi
          if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "release: start the run from the tag $TAG (Use workflow from: the tag), not from $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          # Nothing here pushes; the token must not sit in .git/config for the build to read.
          persist-credentials: false
      # No toolchain cache here: the toolchain runs while the subkey is unlocked, so it is
      # downloaded and checked against its SHA-256 on every run.
      - uses: ./.github/actions/setup-zig
        with:
          cache: 'false'
      - name: Install rpm
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q rpm
      # tag.yml made the release; this is an assertion, not a step that creates it.
      - name: The release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || {
            echo "release: no GitHub release for $TAG (tag.yml makes it); create it, then re-run from the tag" >&2
            exit 1
          }
      # The key and passphrase reach this one step through the environment and the script
      # reads them from there; nothing here prints them or takes them as an argument.
      - name: Sign
        env:
          ZIGBOX_SIGNING_KEY: ${{ secrets.ZIGBOX_SIGNING_KEY }}
          ZIGBOX_SIGNING_PASSPHRASE: ${{ secrets.ZIGBOX_SIGNING_PASSPHRASE }}
          # Pinned here, in reviewed code, not read from the environment: users trust this
          # fingerprint (docs/releases/packaging.md, "The release key").
          ZIGBOX_SIGNING_FPR: 09991DC39816D3C914E2A22C5AB00BC328B7DBB7
        run: .github/release-sign.sh "$RUNNER_TEMP/out"
      - name: The archive holds what packaging.md says and nothing secret
        run: |
          tar -tzf "$RUNNER_TEMP/out/zigbox-repos.tar.gz" > "$RUNNER_TEMP/list"
          grep -q '^apt/dists/stable/InRelease$' "$RUNNER_TEMP/list"
          grep -q '^zigbox-archive-keyring.gpg$' "$RUNNER_TEMP/list"
          ! grep -Evq '^(apt/|rpm/|zigbox-archive-keyring\.(asc|gpg)$)' "$RUNNER_TEMP/list"
          ! grep -Eq '(^|/)\.' "$RUNNER_TEMP/list"
          ! grep -Eq 'to-sign|test-key|passphrase|secret' "$RUNNER_TEMP/list"
      - name: Attach the archive to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "$RUNNER_TEMP/out/zigbox-repos.tar.gz" --clobber --repo "$GITHUB_REPOSITORY"
      # The site deploy is dispatched by `publish`, once `mac` has also finished.

  # The Developer ID signature and the notarization, on the self-hosted Mac runner, in the same
  # `release` environment as `linux` (one approval of the owner covers both). The certificate and
  # the notary key reach a temporary keychain under $RUNNER_TEMP that is never on the search list
  # and is deleted in the last step, whatever happened: the runner is a person's Mac. No secret is
  # printed or passed as a command-line argument; the only passwords on argv are random values
  # made in the job. No runner (MAC_RUNNER_LABEL unset): skipped, and `publish` then fails.
  mac:
    name: sign and notarize (macOS)
    if: ${{ github.ref_type == 'tag' && vars.MAC_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.MAC_RUNNER_LABEL }}
    timeout-minutes: 60
    environment: release
    permissions:
      contents: write
    concurrency:
      group: release-mac-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # The runner context is not available in a job's `env:`, so the paths are set here.
      - name: Paths of the temporary keychain and its work directory
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/zbx-release.keychain-db" >> "$GITHUB_ENV"
          echo "SECRETS_DIR=$RUNNER_TEMP/zbx-release-secrets" >> "$GITHUB_ENV"
      - name: Refuse anything but a release tag
        run: |
          if ! [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z.]+)?$ ]]; then
            echo "release: '$TAG' is not a release tag such as v0.5.0" >&2
            exit 1
          fi
          if [ "$TAG" != "$GITHUB_REF_NAME" ]; then
            echo "release: start the run from the tag $TAG (Use workflow from: the tag), not from $GITHUB_REF_NAME" >&2
            exit 1
          fi
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: refs/tags/${{ env.TAG }}
          persist-credentials: false
      # No toolchain cache: the toolchain runs while the key is unlocked (as on Linux).
      - uses: ./.github/actions/setup-zig-macos
      # Before the keychain exists: this step downloads, and the build needs the file.
      - name: The VM kernel
        run: test -f .zig-cache/zbx-vm/kernel/Image || zig build vm-kernel-fetch
      - name: The release exists
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          command -v gh > /dev/null || { echo "release: the Mac runner needs the GitHub CLI (brew install gh)" >&2; exit 1; }
          gh release view "$TAG" --repo "$GITHUB_REPOSITORY" > /dev/null || {
            echo "release: no GitHub release for $TAG (tag.yml makes it)" >&2
            exit 1
          }
      # Secrets come in through `env:` and are written only to mode-600 files that are deleted
      # in this step. `security import` takes the .p12 password only on argv, so the .p12 is
      # first re-wrapped under a random password made here; MAC_CERT_PASSWORD reaches only
      # openssl, through its environment. Neither the keychain nor the work directory is ever
      # added to the search list or made the default.
      - name: Temporary keychain with the Developer ID certificate and the notary key
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
          MAC_NOTARY_KEY: ${{ secrets.MAC_NOTARY_KEY }}
          MAC_NOTARY_KEY_ID: ${{ vars.MAC_NOTARY_KEY_ID }}
          MAC_NOTARY_ISSUER_ID: ${{ vars.MAC_NOTARY_ISSUER_ID }}
        run: |
          set -euo pipefail
          umask 077
          mkdir "$SECRETS_DIR"
          KEYCHAIN_PASSWORD=$(/usr/bin/openssl rand -hex 24)
          WRAP_PASSWORD=$(/usr/bin/openssl rand -hex 24)
          export WRAP_PASSWORD
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          printf '%s' "$MAC_CERT_P12" | /usr/bin/openssl base64 -d -A -out "$SECRETS_DIR/cert.p12"
          /usr/bin/openssl pkcs12 -in "$SECRETS_DIR/cert.p12" -passin env:MAC_CERT_PASSWORD -nodes |
            /usr/bin/openssl pkcs12 -export -passout env:WRAP_PASSWORD -out "$SECRETS_DIR/wrapped.p12"
          rm -f "$SECRETS_DIR/cert.p12"
          security import "$SECRETS_DIR/wrapped.p12" -k "$KEYCHAIN" -P "$WRAP_PASSWORD" -T /usr/bin/codesign
          rm -f "$SECRETS_DIR/wrapped.p12"
          # Lets codesign use the key from a session with no GUI (else errSecInternalComponent).
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security find-identity -v -p codesigning "$KEYCHAIN"
          printf '%s\n' "$MAC_NOTARY_KEY" > "$SECRETS_DIR/notary.p8"
          xcrun notarytool store-credentials zbx-notary --key "$SECRETS_DIR/notary.p8" \
            --key-id "$MAC_NOTARY_KEY_ID" --issuer "$MAC_NOTARY_ISSUER_ID" --keychain "$KEYCHAIN" > /dev/null
          rm -f "$SECRETS_DIR/notary.p8"
          if security list-keychains -d user | grep -q zbx-release; then
            echo "release: the temporary keychain is on the search list" >&2
            exit 1
          fi
      - name: Sign and notarize
        run: zig build mac-release -Dnotarize -Dkeychain="$KEYCHAIN"
      - name: The zip is the one that was hashed
        run: |
          set -euo pipefail
          cd zig-out/mac-release
          shasum -a 256 -c "zbx-${TAG#v}-macos-arm64.zip.sha256"
      - name: Attach the zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "$TAG" "zig-out/mac-release/zbx-${TAG#v}-macos-arm64.zip" --clobber --repo "$GITHUB_REPOSITORY"
      - name: Keep the formula for publish
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: formula
          path: zig-out/mac-release/zigbox.rb
          if-no-files-found: error
          retention-days: 7
      # Whatever happened: a later pull request job on this runner finds nothing of ours.
      - name: Delete the keychain and everything this job wrote under the runner's temp
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$KEYCHAIN" "$SECRETS_DIR" "$RUNNER_TEMP"/zig-aarch64-macos-*

  # The tap and the site, from the App's token (two repositories, Contents write; Actions read to
  # follow the deploy). `release-publish` admits tags only and has no reviewers: the approval
  # that matters was the `release` one.
  publish:
    name: tap and site
    if: ${{ always() && github.ref_type == 'tag' }}
    needs: [linux, mac]
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    environment: release-publish
    permissions:
      contents: read
    concurrency:
      group: release-publish-${{ github.ref_name }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      # A skipped `mac` (no runner) or a failed job is a release that must not reach the tap.
      - name: Both jobs succeeded
        env:
          LINUX: ${{ needs.linux.result }}
          MAC: ${{ needs.mac.result }}
        run: |
          if [ "$LINUX" != "success" ] || [ "$MAC" != "success" ]; then
            echo "release: not publishing: linux is $LINUX, mac is $MAC (a skipped mac means MAC_RUNNER_LABEL is unset or no runner took the job)" >&2
            exit 1
          fi
      - name: Mint the App token
        id: app
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          app-id: ${{ vars.RELEASE_APP_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          owner: Zigbox
          repositories: |
            homebrew-tap
            zigbox.github.io
          permission-contents: write
          permission-actions: read
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: formula
          path: formula
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: Zigbox/homebrew-tap
          ref: main
          path: tap
          token: ${{ steps.app.outputs.token }}
      # The formula is generated from reviewed code and the hash of the zip the `mac` job
      # uploaded, so it is committed to main without a pull request. Only url, version and
      # sha256 may change, and the hash must be that of the asset on the release.
      - name: Commit the formula to the tap
        env:
          GH_TOKEN: ${{ github.token }}
          APP_SLUG: ${{ steps.app.outputs.app-slug }}
          APP_ID: ${{ vars.RELEASE_APP_ID }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          sha=$(sed -n 's/^ *sha256 "\([0-9a-f]\{64\}\)"$/\1/p' formula/zigbox.rb)
          [ -n "$sha" ] || { echo "release: the formula has no sha256" >&2; exit 1; }
          gh release download "$TAG" --repo "$GITHUB_REPOSITORY" --pattern "zbx-$version-macos-arm64.zip" --dir asset
          echo "$sha  asset/zbx-$version-macos-arm64.zip" | sha256sum -c -
          cd tap
          [ -f Formula/zigbox.rb ] || { echo "release: the tap has no Formula/zigbox.rb" >&2; exit 1; }
          cp ../formula/zigbox.rb Formula/zigbox.rb
          if git diff --quiet; then
            echo "tap: Formula/zigbox.rb is already at $version"
            exit 0
          fi
          if git diff -U0 | grep -E '^[+-]' | grep -Ev '^(\+\+\+|---)' | grep -Evq '^[+-] *(url|version|sha256) "'; then
            echo "release: the formula differs from the tap's in more than url, version and sha256:" >&2
            git diff -U0 >&2
            exit 1
          fi
          git config user.name "${APP_SLUG}[bot]"
          git config user.email "${APP_ID}+${APP_SLUG}[bot]@users.noreply.github.com"
          git commit -a -m "zigbox $version"
          git push origin HEAD:main
      # The deploy fetches every apt and rpm file back from zigbox.org and compares bytes, so a
      # green run is the check. Its run is the first `repository_dispatch` run created after
      # the dispatch; both waits are bounded.
      - name: Dispatch the site deploy and wait for it
        env:
          GH_TOKEN: ${{ steps.app.outputs.token }}
        run: |
          set -euo pipefail
          site=Zigbox/zigbox.github.io
          since=$(date -u -d '30 seconds ago' +%Y-%m-%dT%H:%M:%SZ)
          gh api -X POST "repos/$site/dispatches" -f event_type=site
          run_id=""
          for _ in $(seq 1 60); do
            run_id=$(gh api -X GET "repos/$site/actions/workflows/deploy.yml/runs" -f event=repository_dispatch \
              --jq "[.workflow_runs[] | select(.created_at >= \"$since\")] | sort_by(.created_at) | first | .id // empty")
            [ -n "$run_id" ] && break
            sleep 10
          done
          [ -n "$run_id" ] || { echo "release: the site deploy did not start within 10 minutes" >&2; exit 1; }
          echo "site: waiting for https://github.com/$site/actions/runs/$run_id"
          for _ in $(seq 1 90); do
            result=$(gh api "repos/$site/actions/runs/$run_id" --jq '"\(.status) \(.conclusion // "")"')
            case "$result" in
              "completed success") echo "site: deployed"; exit 0 ;;
              completed*) echo "release: the site deploy ended: $result" >&2; exit 1 ;;
            esac
            sleep 20
          done
          echo "release: the site deploy did not finish within 30 minutes" >&2
          exit 1

  # What a user does, on the Mac runner: install from the tap and run it. No secret, no
  # environment, no checkout. The install stays: it is the runner's zbx.
  verify:
    name: install from the tap
    if: ${{ github.ref_type == 'tag' }}
    needs: publish
    runs-on: ${{ vars.MAC_RUNNER_LABEL }}
    timeout-minutes: 20
    permissions: {}
    env:
      TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
    steps:
      - name: brew install and zbx --version
        run: |
          set -euo pipefail
          version="${TAG#v}"
          brew update
          brew install zigbox/tap/zigbox || brew upgrade zigbox/tap/zigbox
          out=$(zbx --version)
          echo "$out"
          case "$out" in
            *"zbx $version"*) ;;
            *) echo "release: zbx --version does not say $version" >&2; exit 1 ;;
          esac
          brew test zigbox/tap/zigbox

  # The `mac` job's keychain steps with a throwaway self-signed identity made here: signs with
  # it, notarizes nothing, uploads nothing, and no secret is available to it. A pull request from
  # a fork never runs here (the runner is a person's Mac and the repository is public).
  mac-test:
    name: test the Mac signing steps (throwaway identity)
    if: >-
      ${{ github.ref_type != 'tag' && github.event_name != 'workflow_dispatch'
      && vars.MAC_RUNNER_LABEL != ''
      && (github.event_name != 'pull_request'
      || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.MAC_RUNNER_LABEL }}
    timeout-minutes: 45
    concurrency:
      group: release-mac-test-${{ github.ref }}
      cancel-in-progress: true
    env:
    steps:
      # The runner context is not available in a job's `env:`, so the paths are set here.
      - name: Paths of the temporary keychain and its work directory
        run: |
          echo "KEYCHAIN=$RUNNER_TEMP/zbx-release-test.keychain-db" >> "$GITHUB_ENV"
          echo "SECRETS_DIR=$RUNNER_TEMP/zbx-release-test-secrets" >> "$GITHUB_ENV"
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ./.github/actions/setup-zig-macos
      - name: The VM kernel
        run: test -f .zig-cache/zbx-vm/kernel/Image || zig build vm-kernel-fetch
      - name: Temporary keychain with a throwaway self-signed identity
        run: |
          set -euo pipefail
          umask 077
          mkdir "$SECRETS_DIR"
          KEYCHAIN_PASSWORD=$(/usr/bin/openssl rand -hex 24)
          WRAP_PASSWORD=$(/usr/bin/openssl rand -hex 24)
          export WRAP_PASSWORD
          cat > "$SECRETS_DIR/openssl.cnf" <<'CNF'
          [req]
          distinguished_name = dn
          prompt = no
          x509_extensions = ext
          [dn]
          CN = zbx-release-test
          [ext]
          basicConstraints = critical,CA:false
          keyUsage = critical,digitalSignature
          extendedKeyUsage = critical,codeSigning
          CNF
          /usr/bin/openssl req -x509 -newkey rsa:2048 -nodes -days 1 -config "$SECRETS_DIR/openssl.cnf" \
            -keyout "$SECRETS_DIR/key.pem" -out "$SECRETS_DIR/cert.pem"
          /usr/bin/openssl pkcs12 -export -inkey "$SECRETS_DIR/key.pem" -in "$SECRETS_DIR/cert.pem" \
            -passout env:WRAP_PASSWORD -out "$SECRETS_DIR/wrapped.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security set-keychain-settings -t 3600 "$KEYCHAIN"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN"
          security import "$SECRETS_DIR/wrapped.p12" -k "$KEYCHAIN" -P "$WRAP_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN" > /dev/null
          security find-identity -p codesigning "$KEYCHAIN"
          rm -rf "$SECRETS_DIR"
          if security list-keychains -d user | grep -q zbx-release; then
            echo "release: the temporary keychain is on the search list" >&2
            exit 1
          fi
      - name: Sign with it (no notarization, no upload)
        run: zig build mac-release -Dsign-identity=zbx-release-test -Dkeychain="$KEYCHAIN"
      - name: The zip is the one that was hashed
        run: |
          set -euo pipefail
          cd zig-out/mac-release
          shasum -a 256 -c zbx-*-macos-arm64.zip.sha256
      - name: Delete the keychain and everything this job wrote under the runner's temp
        if: ${{ always() }}
        run: |
          security delete-keychain "$KEYCHAIN" || true
          rm -rf "$KEYCHAIN" "$SECRETS_DIR" "$RUNNER_TEMP"/zig-aarch64-macos-*
