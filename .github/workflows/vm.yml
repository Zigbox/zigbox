# VM runs on demand, for work in progress. A push to a branch named vm/<demo>-<anything> runs that
# one demo in the KVM VM, where it takes minutes instead of the quarter hour TCG takes in a build
# container without KVM. <demo> is m0 to m6, m6b, m2b (the M2b workload knobs), m7, m8b (the listener handoff), m9 (the zbx import demo), m10 (the --device and --gpu demo), m6d (Artifact Registry through WIF; not in all, it needs the owner's Google setup), s2 (the S2 demo, demo-s2), s2probe (the S2 slice 1 FUSE probe), m2bprobe (the M2b slice 1 measurements), s2lazy (S2 slice 4, zbx run --lazy from the store), c4 (Zigcube's 0.5.2 requests), m8 (the slice 10 export check, then slice 7's packages on four guests, demo-m8-packages), z7 (the zigbox_vm hostfwd check), or all. Nothing else runs: no build matrix, no fuzzers
# (ci.yml does those on the PR). The run deletes its own scratch branch when it ends, pass or fail,
# because a cloud session's git proxy cannot delete branches; the run and its logs stay readable.
# A newer push to the same branch cancels the run it supersedes. See AGENTS.md, "Git".
name: vm

on:
  push:
    branches: ['vm/**', '!vm/top20-**']

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only to delete the scratch branch at the end
  packages: write # only vm/m8-push-ghcr: the push to ghcr.io/zigbox/zigbox-demo
  # Every vm/* run gets id-token: write (one job; only vm/m6d-* asks for a token): the OIDC token
  # Google's STS exchanges (docs/demos/m6d.md).
  id-token: write

jobs:
  demo:
    name: ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    # One demo fits an hour. vm/s2-* took 32 min (run 416), with step bounds that add up to more;
    # vm/all-* ran demo-m0 to demo-m10 in 58 min, and demo-c4 to demo-z7 come after them.
    timeout-minutes: ${{ startsWith(github.ref_name, 'vm/all-') && 180 || (startsWith(github.ref_name, 'vm/s2-') && 75 || 60) }}
    # demo-m6d's Google setup: repository variables, not secrets (docs/demos/m6d.md).
    env:
      ZBX_GAR_PROVIDER: ${{ vars.ZBX_GAR_PROVIDER }}
      ZBX_GAR_SERVICE_ACCOUNT: ${{ vars.ZBX_GAR_SERVICE_ACCOUNT }}
      ZBX_GAR_REGISTRY: ${{ vars.ZBX_GAR_REGISTRY }}
      ZBX_GCR_REGISTRY: ${{ vars.ZBX_GCR_REGISTRY }}
    steps:
      # The whole history: demo-m3 and later build an older release for the upgrade test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Check the Google setup (vm/m6d-* only)
        id: setup
        if: startsWith(github.ref_name, 'vm/m6d-')
        uses: ./.github/actions/m6d-setup
        with:
          fork: 'false'
      - name: Which demo
        id: pick
        env:
          M6D_RUN: ${{ steps.setup.outputs.run }}
        run: |
          name="${GITHUB_REF_NAME#vm/}"
          demo="${name%%-*}"
          case "$demo" in
            m0|m1|m2|m3|m4|m5|m6|m6b|m7|m8b|m9|m10|c4|z7) steps="demo-$demo" ;;
            s2) steps="demo-s2" ;;
            s2probe) steps="demo-s2-probe" ;;
            m2bprobe) steps="demo-m2b-probe" ;;
            m2b) steps="demo-m2b" ;;
            m8) steps="demo-m8 demo-m8-packages" ;;
            s2lazy) steps="demo-s2-lazy" ;;
            # Without the owner's Google setup, one NOT RUN line and nothing runs.
            m6d) steps="demo-m6d"; if [ "$M6D_RUN" != true ]; then steps=""; fi ;;
            all) steps="demo-m0 demo-m1 demo-m2 demo-m2b demo-m3 demo-m4 demo-m5 demo-m6 demo-m6b demo-m7 demo-m8 demo-m8b demo-m9 demo-m10 demo-c4 demo-s2-probe demo-s2-lazy demo-s2 demo-z7" ;;
            *) echo "vm: branch $GITHUB_REF_NAME names no demo (vm/m0..m6-<x>, vm/m2b-<x>, vm/m6b-<x>, vm/m7-<x>, vm/m8-<x>, vm/m8b-<x>, vm/m9-<x>, vm/m10-<x>, vm/m6d-<x>, vm/c4-<x>, vm/s2-<x>, vm/s2probe-<x>, vm/s2lazy-<x>, vm/z7-<x> or vm/all-<x>)"; exit 1 ;;
          esac
          # The slice 12 check pushes to GHCR from the runner and runs no guest demo.
          if [ "$name" = "m8-push-ghcr" ]; then steps=""; fi
          echo "steps=$steps" >> "$GITHUB_OUTPUT"
      # demo-s2's registry blobs (about 6 GiB) and guest overlay need room the runner image's
      # preinstalled toolchains take.
      - name: Free disk
        if: contains(steps.pick.outputs.steps, 'demo-s2 ') || endsWith(steps.pick.outputs.steps, 'demo-s2')
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache/CodeQL
          df -h /
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entries as ci.yml's demo jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      # The Debian, Fedora and Rocky images of demo-m8-packages (pinned in lib/guests.zon),
      # kept out of .zig-cache/zbx-vm so the vm-image entry that ci.yml's demos restore stays small.
      - name: Cache the other guest images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache/zbx-vm-guests/debian-*.qcow2
            .zig-cache/zbx-vm-guests/Fedora-*.qcow2
            .zig-cache/zbx-vm-guests/Rocky-*.qcow2
          key: vm-guests-${{ hashFiles('src/testing/vm/lib/guests.zon') }}
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      # The blobs demo-m4 pulled last time (ci.yml's demo-m4 has the same entry and key).
      - name: Cache the pulled blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/m4-blobs.img
          key: vm-m4-blobs-${{ hashFiles('src/testing/vm/zbx.lock') }}
      # demo-m4 reaches docker.io through the mirror, as PR CI does (docs/DECISIONS.md, M4).
      - name: Run the demo
        env:
          ZBX_REGISTRY_MIRRORS: mirror.gcr.io
        run: |
          for step in ${{ steps.pick.outputs.steps }}; do
            echo "::group::$step"
            zig build "$step" -Daccel=kvm
            echo "::endgroup::"
          done
      # Slice 12: a real push to GHCR with the run's own GITHUB_TOKEN. The token goes only through
      # stdin (`printf` is a shell builtin, so it is on no command line), never into an argument,
      # an echo or the log; Actions masks it in the log besides.
      - name: Push to GHCR (vm/m8-push-ghcr only)
        if: github.ref_name == 'vm/m8-push-ghcr'
        env:
          ZBX_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZBX_PUSH_USER: ${{ github.actor }}
        run: |
          set -eu
          zig build -Doptimize=ReleaseSafe
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null
          mkdir -p "$RUNNER_TEMP/tree"
          printf 'zbx push to ghcr, run %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tree/hello.txt"
          ref="ghcr.io/zigbox/zigbox-demo:$GITHUB_RUN_ID"
          digest=$(./zig-out/bin/zbx store import "$RUNNER_TEMP/tree")
          printf '%s' "$ZBX_PUSH_TOKEN" |
            ./zig-out/bin/zbx push --username "$ZBX_PUSH_USER" --password-stdin \
              "$digest" "$ref"
      # Not on cancel: a newer push to the branch superseded this run and still needs the branch.
      - name: Delete the scratch branch
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
