# VM runs on demand, for work in progress. A push to a branch named vm/<demo>-<anything> runs that
# one demo in the KVM VM, where it takes minutes instead of the quarter hour TCG takes in a build
# container without KVM. <demo> is m0 to m4, or all. Nothing else runs: no build matrix, no fuzzers
# (ci.yml does those on the PR). The run deletes its own scratch branch when it ends, pass or fail,
# because a cloud session's git proxy cannot delete branches; the run and its logs stay readable.
# A newer push to the same branch cancels the run it supersedes. See AGENTS.md, "Git".
name: vm

on:
  push:
    branches: ['vm/**', '!vm/top20-**']

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only to delete the scratch branch at the end

jobs:
  demo:
    name: ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The whole history: demo-m3 and later build an older release for the upgrade test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Which demo
        id: pick
        run: |
          name="${GITHUB_REF_NAME#vm/}"
          demo="${name%%-*}"
          case "$demo" in
            m0|m1|m2|m3|m4) steps="demo-$demo" ;;
            all) steps="demo-m0 demo-m1 demo-m2 demo-m3 demo-m4" ;;
            *) echo "vm: branch $GITHUB_REF_NAME names no demo (vm/m0..m4-<x> or vm/all-<x>)"; exit 1 ;;
          esac
          echo "steps=$steps" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entries as ci.yml's demo jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/image.zon') }}
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      # demo-m4 reaches docker.io through the mirror, as PR CI does (docs/DECISIONS.md, M4).
      - name: Run the demo
        env:
          ZBX_REGISTRY_MIRRORS: mirror.gcr.io
        run: |
          for step in ${{ steps.pick.outputs.steps }}; do
            echo "::group::$step"
            zig build "$step" -Daccel=kvm
            echo "::endgroup::"
          done
      # Not on cancel: a newer push to the branch superseded this run and still needs the branch.
      - name: Delete the scratch branch
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
