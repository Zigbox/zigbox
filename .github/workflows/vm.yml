# VM runs on demand, for work in progress. A push to a branch named vm/<demo>-<anything> runs that
# one demo in the KVM VM, where it takes minutes instead of the quarter hour TCG takes in a build
# container without KVM. <demo> is m0 to m6, m6b, m7, m8b (the listener handoff), m9 (the zbx import demo), m10 (the --device and --gpu demo), m8 (the slice 10 export check, then slice 7's packages on four guests, demo-m8-packages), z7 (the zigbox_vm hostfwd check), or all. Nothing else runs: no build matrix, no fuzzers
# (ci.yml does those on the PR). The run deletes its own scratch branch when it ends, pass or fail,
# because a cloud session's git proxy cannot delete branches; the run and its logs stay readable.
# A newer push to the same branch cancels the run it supersedes. See AGENTS.md, "Git".
name: vm

on:
  push:
    branches: ['vm/**', '!vm/top20-**']

concurrency:
  group: vm-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write # only to delete the scratch branch at the end
  packages: write # only vm/m8-push-ghcr: the push to ghcr.io/zigbox/zigbox-demo

jobs:
  demo:
    name: ${{ github.ref_name }}
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      # The whole history: demo-m3 and later build an older release for the upgrade test.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: Which demo
        id: pick
        run: |
          name="${GITHUB_REF_NAME#vm/}"
          demo="${name%%-*}"
          case "$demo" in
            m0|m1|m2|m3|m4|m5|m6|m6b|m7|m8b|m9|m10|z7) steps="demo-$demo" ;;
            m8) steps="demo-m8 demo-m8-packages" ;;
            all) steps="demo-m0 demo-m1 demo-m2 demo-m3 demo-m4 demo-m5 demo-m6 demo-m6b demo-m7 demo-m8 demo-m8b demo-m9 demo-m10 demo-z7" ;;
            *) echo "vm: branch $GITHUB_REF_NAME names no demo (vm/m0..m6-<x>, vm/m6b-<x>, vm/m7-<x>, vm/m8-<x>, vm/m8b-<x>, vm/m9-<x>, vm/m10-<x>, vm/z7-<x> or vm/all-<x>)"; exit 1 ;;
          esac
          # The slice 12 check pushes to GHCR from the runner and runs no guest demo.
          if [ "$name" = "m8-push-ghcr" ]; then steps=""; fi
          echo "steps=$steps" >> "$GITHUB_OUTPUT"
      - uses: ./.github/actions/setup-zig
      - name: Install QEMU
        uses: ./.github/actions/install-apt
        with:
          packages: qemu-system-x86 qemu-utils
      - name: Enable KVM
        run: |
          echo 'KERNEL=="kvm", GROUP="kvm", MODE="0666", OPTIONS+="static_node=kvm"' | sudo tee /etc/udev/rules.d/99-kvm4all.rules
          sudo udevadm control --reload-rules
          sudo udevadm trigger --name-match=kvm
      # The same cache entries as ci.yml's demo jobs.
      - name: Cache the VM base image
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm
          key: vm-image-${{ hashFiles('src/testing/vm/lib/image.zon') }}
      # The Debian, Fedora and Rocky images of demo-m8-packages (pinned in lib/guests.zon),
      # kept out of .zig-cache/zbx-vm so the vm-image entry that ci.yml's demos restore stays small.
      - name: Cache the other guest images
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: |
            .zig-cache/zbx-vm-guests/debian-*.qcow2
            .zig-cache/zbx-vm-guests/Fedora-*.qcow2
            .zig-cache/zbx-vm-guests/Rocky-*.qcow2
          key: vm-guests-${{ hashFiles('src/testing/vm/lib/guests.zon') }}
      - name: Cache the Alpine rootfs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/alpine-*.tar.gz
          key: vm-alpine-${{ hashFiles('src/testing/vm/alpine.zon') }}
      # The blobs demo-m4 pulled last time (ci.yml's demo-m4 has the same entry and key).
      - name: Cache the pulled blobs
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .zig-cache/zbx-vm/m4-blobs.img
          key: vm-m4-blobs-${{ hashFiles('src/testing/vm/zbx.lock') }}
      # demo-m4 reaches docker.io through the mirror, as PR CI does (docs/DECISIONS.md, M4).
      - name: Run the demo
        env:
          ZBX_REGISTRY_MIRRORS: mirror.gcr.io
        run: |
          for step in ${{ steps.pick.outputs.steps }}; do
            echo "::group::$step"
            zig build "$step" -Daccel=kvm
            echo "::endgroup::"
          done
      # Slice 12: a real push to GHCR with the run's own GITHUB_TOKEN. The token goes only through
      # stdin (`printf` is a shell builtin, so it is on no command line), never into an argument,
      # an echo or the log; Actions masks it in the log besides.
      - name: Push to GHCR (vm/m8-push-ghcr only)
        if: github.ref_name == 'vm/m8-push-ghcr'
        env:
          ZBX_PUSH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ZBX_PUSH_USER: ${{ github.actor }}
        run: |
          set -eu
          zig build -Doptimize=ReleaseSafe
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0 >/dev/null
          mkdir -p "$RUNNER_TEMP/tree"
          printf 'zbx push to ghcr, run %s\n' "$GITHUB_RUN_ID" > "$RUNNER_TEMP/tree/hello.txt"
          ref="ghcr.io/zigbox/zigbox-demo:$GITHUB_RUN_ID"
          digest=$(./zig-out/bin/zbx store import "$RUNNER_TEMP/tree")
          printf '%s' "$ZBX_PUSH_TOKEN" |
            ./zig-out/bin/zbx push --username "$ZBX_PUSH_USER" --password-stdin \
              "$digest" "$ref"
      # Not on cancel: a newer push to the branch superseded this run and still needs the branch.
      - name: Delete the scratch branch
        if: success() || failure()
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/${{ github.ref_name }}"
