# The macOS job: `zig build check` on an Apple silicon Mac, and the M1 to M4 demos and M4b's steps
# 2 to 4 driven through the macOS zbx inside its virtual machine. It needs a self-hosted runner
# (Virtualization.framework does not run on GitHub's hosted macOS runners), so it runs only when
# the repository variable MAC_RUNNER_LABEL names one; with the variable unset the job is skipped
# with a note, not failed. This workflow imports no certificate and holds no secret: the macOS zbx
# is signed ad hoc by `zig build`, and the release (Developer ID, notarization) is the owner's,
# from their own session (docs/demos/m4b.md, "Releasing").
name: mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  skipped:
    name: macOS job skipped (no runner label)
    if: ${{ vars.MAC_RUNNER_LABEL == '' }}
    runs-on: ubuntu-24.04
    steps:
      - run: echo "::notice::The macOS job did not run. Set the repository variable MAC_RUNNER_LABEL to the label of a self-hosted Apple silicon runner to enable it."

  mac:
    name: check and demos on macOS
    if: ${{ vars.MAC_RUNNER_LABEL != '' }}
    runs-on: ${{ vars.MAC_RUNNER_LABEL }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig-macos
      # The VM's kernel is pinned and built once (docker), then cached on the runner; a runner
      # without it fails here with the one line that names the step.
      - name: Every gate
        run: zig build check --summary all
      # Pulls Alpine and nginx (Docker Hub, through ZBX_REGISTRY_MIRRORS when the runner sets it)
      # and fetches the pinned Alpine minirootfs from dl-cdn.
      - name: Demos M1 to M4 and M4b steps 2 to 4, from macOS
        run: zig build demo-mac
      - name: Stop the machine
        if: always()
        run: ./zig-out/bin/zbx vm stop
