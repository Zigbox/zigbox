# The macOS job: `zig build check` on an Apple silicon Mac, and the M1 to M4 demos and M4b's steps
# 2 to 4 driven through the macOS zbx inside its virtual machine. It needs a self-hosted runner
# (Virtualization.framework does not run on GitHub's hosted macOS runners), so it runs only when
# the repository variable MAC_RUNNER_LABEL names one, and never for a pull request from a fork
# (the repository is public); in both cases the job is skipped with a note saying which, not failed. This workflow imports no certificate and holds no secret: the macOS zbx
# is signed ad hoc by `zig build`, and the release (Developer ID, notarization) is the owner's,
# from their own session (docs/demos/m4b.md, "Releasing").
name: mac

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: mac-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  # The repository is public, and a pull request from a fork runs the fork's code: it must never
  # reach a self-hosted runner. Only pushes to main, manual runs, and pull requests from branches
  # of this repository (people with write access) run on it.
  skipped:
    name: macOS job skipped
    if: ${{ vars.MAC_RUNNER_LABEL == '' || (github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository) }}
    runs-on: ubuntu-24.04
    steps:
      - name: Say why
        env:
          NO_LABEL: ${{ vars.MAC_RUNNER_LABEL == '' }}
        run: |
          if [ "${NO_LABEL}" = "true" ]; then
            echo "::notice::The macOS job did not run: the repository variable MAC_RUNNER_LABEL is not set. Set it to the label of a self-hosted Apple silicon runner to enable the job."
          else
            echo "::notice::The macOS job did not run: this pull request comes from a fork, and a fork's code does not run on the self-hosted runner."
          fi

  mac:
    name: check and demos on macOS
    if: ${{ vars.MAC_RUNNER_LABEL != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) }}
    runs-on: ${{ vars.MAC_RUNNER_LABEL }}
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-zig-macos
      # The VM's kernel is pinned. A runner with neither the toolchain nor Docker downloads it
      # from the release named in vm/kernel/pin.zon (checked against the pinned digest), once; a
      # runner that has it already does nothing. Until the release exists this step fails with
      # the message that says how to build the kernel instead.
      - name: The VM kernel
        run: test -f .zig-cache/zbx-vm/kernel/Image || zig build vm-kernel-fetch
      - name: Every gate
        run: zig build check --summary all
      # Pulls Alpine and nginx (Docker Hub, through ZBX_REGISTRY_MIRRORS when the runner sets it)
      # and fetches the pinned Alpine minirootfs from dl-cdn.
      - name: Demos M1 to M4 and M4b steps 2 to 4, from macOS
        run: zig build demo-mac
      - name: Stop the machine
        if: always()
        run: ./zig-out/bin/zbx vm stop
