name: Check the macOS release zip
description: >
  Unpacks a zbx release zip and checks what a user gets: the signature is valid and strict, the
  binary holds both slices (arm64 and x86_64), Gatekeeper accepts it (unless the zip is a test
  build), and `zbx --version` says the version. The system tools are called by absolute path.
  Runs on the runner's own architecture, so the slice it can execute is the one that is run;
  the release's `verify` job runs it on both an arm64 and an Intel runner.
inputs:
  zip:
    description: Path of the zip.
    required: true
  version:
    description: The version the binary must report, such as 0.5.1.
    required: true
  gatekeeper:
    description: '"true" to require spctl to accept the binary (notarized builds), else "false".'
    required: true
runs:
  using: composite
  steps:
    - name: Check the zip
      shell: /bin/bash --noprofile --norc -euo pipefail {0}
      env:
        ZIP: ${{ inputs.zip }}
        VERSION: ${{ inputs.version }}
        GATEKEEPER: ${{ inputs.gatekeeper }}
      run: |
        dir=$(/usr/bin/mktemp -d "${RUNNER_TEMP}/zbx-check.XXXXXX")
        /usr/bin/ditto -x -k "$ZIP" "$dir"
        listing=$(/bin/ls -A "$dir")
        if [ "$listing" != "zbx" ]; then
          echo "release: the zip holds '$listing', not zbx alone" >&2
          exit 1
        fi
        binary="$dir/zbx"
        /usr/bin/codesign --verify --strict --verbose=2 "$binary"
        archs=$(/usr/bin/lipo -archs "$binary")
        echo "archs: $archs"
        case " $archs " in
          *" arm64 "*) ;;
          *) echo "release: zbx holds '$archs', not both arm64 and x86_64" >&2; exit 1 ;;
        esac
        case " $archs " in
          *" x86_64 "*) ;;
          *) echo "release: zbx holds '$archs', not both arm64 and x86_64" >&2; exit 1 ;;
        esac
        if [ "$(printf '%s\n' "$archs" | /usr/bin/wc -w | /usr/bin/tr -d ' ')" != "2" ]; then
          echo "release: zbx holds more than arm64 and x86_64: $archs" >&2
          exit 1
        fi
        if [ "$GATEKEEPER" = "true" ]; then
          # A bare Mach-O is judged as an executable; some macOS versions only judge it as an
          # open document with its primary signature. Either acceptance is Gatekeeper's, and
          # both are shown; an unsigned or un-notarized binary is refused by both.
          if /usr/sbin/spctl --assess --type execute --verbose=2 "$binary"; then
            :
          elif /usr/sbin/spctl --assess --type open --context context:primary-signature \
            --verbose=2 "$binary"; then
            :
          else
            echo "release: Gatekeeper (spctl) does not accept zbx" >&2
            exit 1
          fi
        fi
        out=$("$binary" --version)
        echo "$out"
        case "$out" in
          *"zbx $VERSION"*) ;;
          *) echo "release: zbx --version does not say $VERSION" >&2; exit 1 ;;
        esac
        /bin/rm -rf "$dir"
