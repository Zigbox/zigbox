name: Find the draft release of a tag
description: >
  Looks for a draft GitHub release named by a tag (a draft has no tag yet, so the releases are
  listed). Fails when the draft targets another commit than `sha`, or when `require` is true and
  there is none. The caller sets GH_TOKEN (contents: write sees drafts) and runs the pinned gh.
inputs:
  tag:
    description: The tag, such as v0.5.1.
    required: true
  sha:
    description: The commit the draft must target.
    required: true
  require:
    description: '"true" fails when there is no draft.'
    required: false
    default: 'false'
outputs:
  id:
    description: The draft's release id, or empty when there is none.
    value: ${{ steps.find.outputs.id }}
runs:
  using: composite
  steps:
    - name: Find
      id: find
      shell: bash --noprofile --norc -euo pipefail {0}
      env:
        TAG: ${{ inputs.tag }}
        SHA: ${{ inputs.sha }}
        REQUIRE: ${{ inputs.require }}
      run: |
        rows=$(gh api --paginate "repos/$GITHUB_REPOSITORY/releases?per_page=100" |
          jq -r --arg tag "$TAG" '.[] | select(.tag_name == $tag and .draft) | "\(.id) \(.target_commitish)"')
        count=$(grep -c . <<< "$rows" || true)
        if [ "$count" -gt 1 ]; then
          echo "release: there are $count draft releases for $TAG; delete all but one" >&2
          exit 1
        fi
        if [ "$count" = 0 ]; then
          if [ "$REQUIRE" = true ]; then
            echo "release: there is no draft release for $TAG" >&2
            exit 1
          fi
          echo "id=" >> "$GITHUB_OUTPUT"
          exit 0
        fi
        read -r id target <<< "$rows"
        if [ "$target" != "$SHA" ]; then
          echo "release: the draft for $TAG targets $target, not $SHA; delete the draft and run again" >&2
          exit 1
        fi
        echo "draft: $TAG is release $id at $SHA"
        echo "id=$id" >> "$GITHUB_OUTPUT"
